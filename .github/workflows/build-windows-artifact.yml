name: Build Windows exe (artifact)

# Build Windows lazagne.exe as a downloadable artifact (private to the repo),
# no tag and no public release needed.
# Runs automatically on push to master, or manually: Actions tab -> Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        cd Windows
        pyinstaller lazagne.spec

    - name: Upload exe artifact
      uses: actions/upload-artifact@v4
      with:
        name: lazagne-exe
        path: Windows/dist/lazagne.exe
        if-no-files-found: error
